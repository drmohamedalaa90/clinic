<script>
(() => {
  const C = window.Clinic;
  if (!C || window.__clinicV94InlineExtras) return;
  window.__clinicV94InlineExtras = true;

  const PAGES = new Set(['appointments','doctor-appointments']);
  const HIDDEN = new Set(['cancelled','rescheduled']);
  const tr = (en,ar) => C.lang === 'ar' ? ar : en;

  const style = document.createElement('style');
  style.id = 'clinic-v94-inline-extra-style';
  style.textContent = `
    .v86-extra-day-list,.v88-extra-day-list,.v89-extra-day-list,
    .v90-extra-block,.v91-extra-card,.v93-extra-card{display:none!important}

    .v94-extra-card{
      width:100%;max-width:100%;box-sizing:border-box;
      margin-top:10px;border:1px solid #dbe4ee;border-radius:14px;
      background:#fff;overflow:hidden;
    }
    .v94-extra-head{
      display:flex;align-items:center;justify-content:space-between;
      gap:8px;padding:10px 12px;border-bottom:1px solid #e6edf5;
    }
    .v94-extra-head strong{
      color:#10233c;font-size:13px;font-weight:900;
    }
    .v94-extra-head small{
      display:block;margin-top:2px;color:#718096;font-size:9px;
    }
    .v94-extra-pill{
      flex:0 0 auto;padding:4px 8px;border-radius:999px;
      border:1px solid #fed7aa;background:#fff7ed;color:#b45309;
      font-size:10px;font-weight:900;
    }
    .v94-extra-row{
      width:100%;max-width:100%;min-width:0;box-sizing:border-box;
      display:grid;grid-template-columns:28px minmax(0,1fr);
      gap:8px;align-items:center;padding:10px 12px;
      border:0;border-bottom:1px solid #edf2f7;background:#fff;
      color:inherit;text-align:start;cursor:pointer;
    }
    .v94-extra-row:last-child{border-bottom:0}
    .v94-extra-row:hover{background:#f8fbff}
    .v94-extra-num{
      width:28px;height:28px;border-radius:9px;
      display:grid;place-items:center;background:#f1f5f9;
      color:#475569;font-size:11px;font-weight:900;
    }
    .v94-extra-copy{min-width:0;display:grid;gap:2px}
    .v94-extra-copy strong,.v94-extra-copy small{
      min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .v94-extra-copy strong{color:#10233c;font-size:11px;font-weight:850}
    .v94-extra-copy small{color:#718096;font-size:9px}
    .v94-extra-time{color:#b45309;font-weight:850}
    .v94-extra-status{color:#0f766e;font-weight:850}
    .v94-actions{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px
    }
    .v94-actions button{width:100%;min-width:0}
    [dir="rtl"] .v94-extra-row{text-align:right}
  `;
  document.head.appendChild(style);

  function cairoYmd(value){
    try{
      const p = new Intl.DateTimeFormat('en-CA',{
        timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'
      }).formatToParts(new Date(value));
      const g = k => p.find(x=>x.type===k)?.value || '';
      return `${g('year')}-${g('month')}-${g('day')}`;
    }catch{return '';}
  }

  function fmtTime(value){
    try{
      return new Intl.DateTimeFormat(C.lang==='ar'?'ar-EG':'en-US',{
        timeZone:'Africa/Cairo',hour:'numeric',minute:'2-digit',hour12:true
      }).format(new Date(value));
    }catch{return '';}
  }

  function normalizeDigits(s=''){
    const ar='٠١٢٣٤٥٦٧٨٩';
    return String(s).replace(/[٠-٩]/g,c=>String(ar.indexOf(c)));
  }

  function parseCardDate(card){
    const direct = card.querySelector('[data-date]')?.dataset?.date;
    if(direct && /^\d{4}-\d{2}-\d{2}$/.test(direct)) return direct;

    const start = card.querySelector('[data-start]')?.dataset?.start;
    if(start) {
      const x = cairoYmd(start);
      if(x) return x;
    }

    const x = normalizeDigits(card.querySelector('.scheduler-day-header')?.textContent || '');
    let m = x.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m) return `${m[3]}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;

    const months={
      jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,
      may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,
      sep:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12,
      'يناير':1,'فبراير':2,'مارس':3,'أبريل':4,'ابريل':4,'مايو':5,'يونيو':6,
      'يوليو':7,'أغسطس':8,'اغسطس':8,'سبتمبر':9,'أكتوبر':10,'اكتوبر':10,
      'نوفمبر':11,'ديسمبر':12
    };

    const lower=x.toLowerCase();
    for(const [name,n] of Object.entries(months)){
      m = lower.match(new RegExp('(\\d{1,2})\\s+'+name+'\\s+(\\d{4})','i'));
      if(m) return `${m[2]}-${String(n).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
    }
    return null;
  }

  function dayCards(){
    return [...document.querySelectorAll('.scheduler-day-card')]
      .map(card=>({card,date:parseCardDate(card)}))
      .filter(x=>x.date);
  }

  function doctorId(){
    if(C.currentPage==='doctor-appointments') return C.user?.id || '';
    return document.getElementById('calendarDoctor')?.value || C.doctors?.[0]?.id || '';
  }

  function statusLabel(s){
    const en={booked:'Booked',confirmed:'Confirmed',arrived:'Arrived',waiting:'Waiting',
      with_doctor:'With doctor',completed:'Completed',no_show:'No-show'};
    const ar={booked:'محجوز',confirmed:'مؤكد',arrived:'وصل',waiting:'انتظار',
      with_doctor:'مع الطبيب',completed:'مكتمل',no_show:'لم يحضر'};
    return (C.lang==='ar'?ar:en)[s] || s || '';
  }

  async function loadRows(doc, dates){
    const sorted=[...dates].sort();
    const from=`${sorted[0]}T00:00:00+03:00`;
    const end=new Date(`${sorted.at(-1)}T23:59:59+03:00`);
    end.setTime(end.getTime()+86400000);

    const q = await C.sb
      .from('appointments')
      .select('*')
      .eq('doctor_id',doc)
      .gte('scheduled_start',from)
      .lt('scheduled_start',end.toISOString())
      .order('scheduled_start');

    if(q.error) throw q.error;

    const rows=(q.data||[]).filter(a=>
      !HIDDEN.has(String(a.status||'')) &&
      (
        String(a.booking_source||'').toLowerCase()==='extra_case' ||
        String(a.booking_source||'').toLowerCase().includes('extra')
      )
    );

    const ids=[...new Set(rows.map(a=>a.patient_id).filter(Boolean))];
    let map=new Map();

    if(ids.length){
      const p=await C.sb
        .from('patients')
        .select('id,medical_record_number,english_name,arabic_name,mobile,birth_year')
        .in('id',ids);

      if(!p.error) map=new Map((p.data||[]).map(x=>[x.id,x]));
    }

    return rows.map(a=>({...a,patient:map.get(a.patient_id)||{}}));
  }

  function canReception(){
    return C.isReception?.() || C.hasRole?.('owner') || C.hasRole?.('manager') ||
      C.hasRole?.('deputy_manager') || C.hasRole?.('secretary');
  }

  async function rpc(name,args,msg){
    const {error}=await C.sb.rpc(name,args);
    if(error) return C.toast(error.message,'error');
    C.closeModal();
    C.toast(msg);
    C.route(C.currentPage);
  }

  function checkIn(a){
    C.showModal({
      title:tr('Confirm patient arrival','تأكيد حضور المريض'),
      body:`
        <form id="v94Checkin" class="form-grid">
          <label>${tr('Fees (EGP)','الرسوم (جنيه)')}
            <input id="v94Fee" class="control" type="number" min="0" step="1" required>
          </label>
          <label>${tr('Payment method','طريقة الدفع')}
            <select id="v94Pay" class="control">
              <option value="cash">${tr('Cash','نقدي')}</option>
              <option value="instapay">InstaPay</option>
              <option value="card">${tr('Card','بطاقة')}</option>
              <option value="bank_transfer">${tr('Bank transfer','تحويل بنكي')}</option>
              <option value="other">${tr('Other','أخرى')}</option>
            </select>
          </label>
          <div class="form-actions full-span">
            <button class="primary-button compact">${tr('Confirm arrival','تأكيد الحضور')}</button>
          </div>
        </form>`,
      onOpen:root=>{
        root.querySelector('#v94Checkin').onsubmit=async e=>{
          e.preventDefault();
          await rpc('frontend_check_in_with_fee',{
            p_id:a.id,
            p_fee:Number(root.querySelector('#v94Fee').value||0),
            p_payment_method:root.querySelector('#v94Pay').value,
            p_note:null
          },tr('Checked in.','تم تسجيل الوصول.'));
        };
      }
    });
  }

  function openActions(a){
    const p=a.patient||{};
    const can=canReception();

    C.showModal({
      title:tr('Extra case','حالة إضافية'),
      body:`
        <div class="appointment-detail-card">
          <div class="appointment-detail-patient">
            <span class="eyebrow">${C.escape(p.medical_record_number||a.appointment_number||'')}</span>
            <h3>${C.escape(p.english_name||p.arabic_name||tr('Patient','مريض'))}</h3>
            <p class="muted">${C.escape(fmtTime(a.scheduled_start))} • ${C.escape(statusLabel(a.status))}</p>
          </div>
          <div class="v94-actions">
            ${['booked','confirmed'].includes(a.status)&&can?`
              <button class="secondary-button compact" data-v94="edit">${tr('Edit booking','تعديل الحجز')}</button>
              <button class="secondary-button compact" data-v94="checkin">${tr('Check in','تسجيل الوصول')}</button>
              <button class="secondary-button compact" data-v94="noshow">${tr('No-show','لم يحضر')}</button>
              <button class="danger-button compact" data-v94="cancel">${tr('Cancel','إلغاء')}</button>
            `:''}
            ${a.status==='arrived'&&can?`
              <button class="primary-button compact" data-v94="send">${tr('Send to doctor','إرسال للطبيب')}</button>
            `:''}
          </div>
        </div>`,
      onOpen:root=>{
        root.querySelector('[data-v94="edit"]')?.addEventListener('click',()=>{
          C.closeModal();
          window.ClinicBookingWorkflow?.showEditBookingModal?.(a.id);
        });
        root.querySelector('[data-v94="checkin"]')?.addEventListener('click',()=>checkIn(a));
        root.querySelector('[data-v94="noshow"]')?.addEventListener('click',()=>rpc(
          'frontend_mark_no_show',{p_id:a.id,p_reason:null},tr('Marked no-show.','تم تسجيل عدم الحضور.')
        ));
        root.querySelector('[data-v94="cancel"]')?.addEventListener('click',()=>{
          const reason=prompt(tr('Cancellation reason','سبب الإلغاء'));
          if(reason) rpc('frontend_cancel_appointment',{p_id:a.id,p_reason:reason},
            tr('Appointment cancelled.','تم إلغاء الموعد.'));
        });
        root.querySelector('[data-v94="send"]')?.addEventListener('click',()=>rpc(
          'frontend_send_to_doctor',{p_id:a.id},tr('Sent to doctor.','تم إرسال المريض للطبيب.')
        ));
      }
    });
  }

  function render(day, rows){
    day.card.querySelectorAll('.v94-extra-card').forEach(x=>x.remove());
    if(!rows.length) return;

    const block=document.createElement('section');
    block.className='v94-extra-card';
    block.innerHTML=`
      <div class="v94-extra-head">
        <div>
          <strong>${tr('Extra cases','الحالات الإضافية')}</strong>
          <small>${rows.length} ${tr(rows.length===1?'patient':'patients','مريض')}</small>
        </div>
        <span class="v94-extra-pill">${rows.length}</span>
      </div>
      ${rows.map((a,i)=>{
        const p=a.patient||{};
        return `
          <button type="button" class="v94-extra-row" data-v94-id="${C.escape(a.id)}">
            <span class="v94-extra-num">${i+1}</span>
            <span class="v94-extra-copy">
              <strong>${C.escape(p.english_name||p.arabic_name||tr('Patient','مريض'))}</strong>
              <small>
                <span class="v94-extra-time">${C.escape(fmtTime(a.scheduled_start))}</span>
                • <span class="v94-extra-status">${C.escape(statusLabel(a.status))}</span>
                ${p.mobile?` • ${C.escape(p.mobile)}`:''}
              </small>
            </span>
          </button>`;
      }).join('')}
    `;

    const stack=day.card.querySelector('.scheduler-slot-stack');
    if(stack) stack.insertAdjacentElement('afterend',block);
    else day.card.appendChild(block);

    const map=new Map(rows.map(a=>[a.id,a]));
    block.querySelectorAll('[data-v94-id]').forEach(btn=>{
      btn.onclick=()=>openActions(map.get(btn.dataset.v94Id));
    });
  }

  let busy=false, rerun=false;
  async function refresh(){
    if(!PAGES.has(C.currentPage)) return;
    const cards=dayCards();
    const doc=doctorId();
    if(!cards.length||!doc) return;

    if(busy){rerun=true;return;}
    busy=true;

    try{
      const dates=[...new Set(cards.map(x=>x.date))];
      const rows=await loadRows(doc,dates);
      cards.forEach(day=>render(
        day,
        rows.filter(a=>cairoYmd(a.scheduled_start)===day.date)
      ));
    }catch(err){
      console.error('V94 inline extra cases:',err);
    }finally{
      busy=false;
      if(rerun){rerun=false;queueMicrotask(refresh);}
    }
  }

  let raf=0;
  new MutationObserver(()=>{
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(refresh);
  }).observe(document.getElementById('mainContent')||document.body,{
    childList:true,subtree:true
  });

  document.addEventListener('change',e=>{
    if(['calendarDoctor','calendarWeekCount'].includes(e.target?.id)){
      requestAnimationFrame(refresh);
    }
  });

  requestAnimationFrame(refresh);
})();
</script>
