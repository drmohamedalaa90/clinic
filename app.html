  <!-- =====================================================
       V60 SAFE FRIDAY FOCUS + ONE "+" BESIDE EACH DAY NAME
       - No pre-paint hiding
       - No blank-page risk
       - Works in English + Arabic
       ===================================================== -->
  <script>
  (function(){
    const C = window.Clinic;
    if(!C || C.__v60SafeCalendarLoaded) return;
    C.__v60SafeCalendarLoaded = true;

    const DAY_NAMES = [
      'Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday',
      'السبت','الأحد','الاحد','الإثنين','الاثنين','الثلاثاء',
      'الأربعاء','الاربعاء','الخميس','الجمعة'
    ];

    const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

    const DAY_RE = new RegExp(
      '^(' + DAY_NAMES.map(escapeRe).join('|') + ')$',
      'i'
    );

    const ANY_DAY_RE = new RegExp(
      '(' + DAY_NAMES.map(escapeRe).join('|') + ')',
      'gi'
    );

    function cairoParts(){
      const parts = new Intl.DateTimeFormat('en-CA',{
        timeZone:'Africa/Cairo',
        year:'numeric',
        month:'2-digit',
        day:'2-digit',
        weekday:'short'
      }).formatToParts(new Date());

      const get = type => parts.find(x=>x.type===type)?.value || '';

      return {
        year:Number(get('year')),
        month:Number(get('month')),
        day:Number(get('day')),
        weekday:get('weekday')
      };
    }

    function isFriday(){
      return cairoParts().weekday === 'Fri';
    }

    function cairoToday(){
      const p = cairoParts();
      return new Date(Date.UTC(p.year,p.month-1,p.day,12,0,0));
    }

    function nextSaturday(date){
      const d = new Date(date);
      const add = (6 - d.getUTCDay() + 7) % 7 || 7;
      d.setUTCDate(d.getUTCDate() + add);
      return d;
    }

    function ymd(d){
      return [
        d.getUTCFullYear(),
        String(d.getUTCMonth()+1).padStart(2,'0'),
        String(d.getUTCDate()).padStart(2,'0')
      ].join('-');
    }

    function appointmentsPage(){
      return ['appointments','doctor-appointments'].includes(C.currentPage);
    }

    function normalizeArabicDigits(s=''){
      const ar='٠١٢٣٤٥٦٧٨٩';
      return String(s).replace(/[٠-٩]/g, ch => String(ar.indexOf(ch)));
    }

    function parseVisibleDate(text=''){
      const t = normalizeArabicDigits(text);

      let m = t.match(/\b(\d{2})\/(\d{2})\/(\d{4})\b/);
      if(m) return `${m[3]}-${m[2]}-${m[1]}`;

      const months = {
        'يناير':1,'فبراير':2,'مارس':3,'أبريل':4,'ابريل':4,'مايو':5,
        'يونيو':6,'يوليو':7,'أغسطس':8,'اغسطس':8,'سبتمبر':9,
        'أكتوبر':10,'اكتوبر':10,'نوفمبر':11,'ديسمبر':12
      };

      for(const [name,num] of Object.entries(months)){
        const re = new RegExp('(\\d{1,2})\\s+' + name + '\\s+(\\d{4})');
        m = t.match(re);

        if(m){
          return `${m[2]}-${String(num).padStart(2,'0')}-${String(Number(m[1])).padStart(2,'0')}`;
        }
      }

      return null;
    }

    function parseWeekRange(text=''){
      const t = normalizeArabicDigits(text);

      const m = t.match(
        /(\d{2})\/(\d{2})\/(\d{4})\s*[–-]\s*(\d{2})\/(\d{2})\/(\d{4})/
      );

      if(!m) return null;

      return {
        start:`${m[3]}-${m[2]}-${m[1]}`,
        end:`${m[6]}-${m[5]}-${m[4]}`
      };
    }

    function getWeekContainers(){
      const all = [...document.querySelectorAll('section,article,div')];
      const result = [];

      for(const el of all){
        const txt = (el.textContent || '').trim();

        let range = parseWeekRange(txt);

        if(!range){
          const labels = [...el.querySelectorAll('div,span,strong,h3,h4')]
            .filter(x => DAY_RE.test((x.textContent || '').trim()));

          if(labels.length < 7) continue;

          const dates = [];

          for(const label of labels){
            let node = label.parentElement;
            let hops = 0;
            let found = null;

            while(node && hops < 5 && !found){
              found = parseVisibleDate(node.textContent || '');
              node = node.parentElement;
              hops++;
            }

            if(found && !dates.includes(found)){
              dates.push(found);
            }
          }

          if(dates.length < 7) continue;

          range = {
            start:dates[0],
            end:dates[dates.length-1]
          };
        }

        const nested = [...el.children].some(child=>{
          const t=(child.textContent||'').trim();
          return !!parseWeekRange(t);
        });

        if(nested && parseWeekRange(txt)) continue;

        if(!result.some(x=>x.el===el)){
          result.push({el,...range});
        }
      }

      return result;
    }

    function fridayFocus(){
      if(!appointmentsPage() || !isFriday()) return;

      const target = ymd(nextSaturday(cairoToday()));

      const jump = document.querySelector(
        '#jumpDate,#calendarJumpDate,input[data-jump-date][type="date"]'
      );

      if(jump && jump.value !== target){
        jump.value = target;
        jump.dispatchEvent(new Event('change',{bubbles:true}));
      }

      setTimeout(()=>{
        const weeks = getWeekContainers();
        if(!weeks.length) return;

        const targetWeek = weeks.find(w=>w.start===target);
        if(!targetWeek) return;

        targetWeek.el.scrollIntoView({
          behavior:'auto',
          block:'start'
        });
      },120);
    }

    function parseDateFromColumn(col){
      const direct =
        col.dataset?.date ||
        col.querySelector('[data-date]')?.dataset?.date;

      if(direct && /^\d{4}-\d{2}-\d{2}$/.test(direct)){
        return direct;
      }

      return parseVisibleDate(col.textContent || '');
    }

    function openExtraCase(date){
      if(typeof C.openExtraCaseModal === 'function'){
        C.openExtraCaseModal({date});
        return;
      }

      const topButton = document.getElementById('v51ExtraCaseButton');

      if(topButton){
        topButton.click();

        setTimeout(()=>{
          const dateInput = document.querySelector(
            '#v54Date,#v52Date,#v51ExtraDate'
          );

          if(dateInput){
            dateInput.value = date;
            dateInput.dispatchEvent(new Event('change',{bubbles:true}));
          }
        },60);

        return;
      }

      if(C.toast){
        C.toast(
          C.lang==='ar'
            ? 'تعذر فتح نافذة الحالة الإضافية.'
            : 'Could not open extra-case form.',
          'error'
        );
      }
    }

    function removeOldDayButtons(){
      document.querySelectorAll(
        '.v53-day-extra-btn,'+
        '.v54-day-extra-btn,'+
        '.v54-day-extra-slot,'+
        '.v56-day-plus,'+
        '.v56-day-plus-wrap,'+
        '.v57-day-plus,'+
        '.v58-day-plus,'+
        '.v59-day-plus,'+
        '.v60-day-plus'
      ).forEach(x=>{
        if(!x.classList.contains('v60-day-plus')){
          x.remove();
        }
      });
    }

    function findDayColumns(){
      const labels = [...document.querySelectorAll('div,span,strong,h3,h4')]
        .filter(el=>DAY_RE.test((el.textContent||'').trim()));

      const out = [];

      for(const label of labels){
        let col = label.parentElement;
        let hops = 0;

        while(col && hops < 6){
          const text = (col.textContent || '').trim();
          const dayMatches = text.match(ANY_DAY_RE) || [];

          if(dayMatches.length === 1 && parseVisibleDate(text)){
            break;
          }

          col = col.parentElement;
          hops++;
        }

        if(!col) continue;

        const date = parseDateFromColumn(col);
        if(!date) continue;

        if(!out.some(x=>x.col===col)){
          out.push({col,label,date});
        }
      }

      return out;
    }

    function injectDayPlus(){
      if(!appointmentsPage()) return;

      removeOldDayButtons();

      for(const {col,label,date} of findDayColumns()){
        const existing = col.querySelectorAll('.v60-day-plus');

        existing.forEach((b,i)=>{
          if(i>0) b.remove();
        });

        if(existing.length) continue;

        let row = label.parentElement;

        if(
          !row ||
          row===col ||
          /\d{1,2}:\d{2}/.test(normalizeArabicDigits(row.textContent || ''))
        ){
          row = document.createElement('div');
          row.className = 'v60-day-title-row';

          label.parentNode.insertBefore(row,label);
          row.appendChild(label);
        }else{
          row.classList.add('v60-day-title-row');
        }

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'v60-day-plus';
        btn.textContent = '＋';
        btn.title = C.lang==='ar'
          ? 'إضافة حالة إضافية لهذا اليوم'
          : 'Add extra case for this day';

        btn.addEventListener('click',e=>{
          e.preventDefault();
          e.stopPropagation();
          openExtraCase(date);
        });

        row.appendChild(btn);
      }
    }

    function run(){
      if(!appointmentsPage()) return;
      injectDayPlus();
      fridayFocus();
    }

    let timer = null;

    new MutationObserver(()=>{
      clearTimeout(timer);
      timer = setTimeout(run,40);
    }).observe(document.body,{
      childList:true,
      subtree:true
    });

    document.addEventListener('click',e=>{
      if(e.target.closest('.app-lang-btn')){
        setTimeout(run,120);
        setTimeout(run,300);
      }
    });

    run();
  })();
  </script>
